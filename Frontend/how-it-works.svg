<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="how-it-works-title how-it-works-desc" xmlns:c2pa="http://c2pa.org/manifest">
<title id="how-it-works-title">How CineMatch AI works</title>
<desc id="how-it-works-desc">The browser sends a movie title to a Flask server, which computes cosine similarity against tag vectors built from movies_list.pkl and returns the top five matches, while posters come from TMDB.</desc>
<defs>
<marker id="hiw-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a8a69f"/></marker>
<marker id="hiw-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e6a94d"/></marker>
<marker id="hiw-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7fa6c9"/></marker>
<style>
  .eyebrow{font:500 11px ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.14em;fill:#a8a69f}
  .h1{font:400 30px "Instrument Serif","Iowan Old Style","Palatino Linotype",Georgia,serif;letter-spacing:-.01em;fill:#ecebe7}
  .name{font:600 14px "Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#ecebe7}
  .sub{font:400 11px ui-monospace,"SF Mono",Menlo,Consolas,monospace;fill:#a8a69f}
  .tag{font:500 9px ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.08em}
  .lbl{font:500 10px ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.04em;fill:#a8a69f}
  .note{font:italic 400 15px "Instrument Serif","Iowan Old Style",Georgia,serif;fill:#85837c}
  .leg{font:400 12px "Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#a8a69f}
</style>
</defs>
<rect width="960" height="640" fill="#0e0e0f"/>
<text class="eyebrow" x="40" y="44">HOW IT WORKS</text>
<text class="h1" x="40" y="82">From a movie title to five matches</text>
