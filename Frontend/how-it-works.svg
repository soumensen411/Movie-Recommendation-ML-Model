<rect x="360" y="256" width="192" height="88" rx="6" fill="#151516" stroke="#ecebe7" stroke-width="1"/>
<rect x="376" y="268" width="29" height="14" rx="2" fill="none" stroke="#a8a69f" stroke-opacity=".55"/>
