<text class="name" x="376" y="302">Flask server</text>
<text class="sub" x="376" y="318">server.py</text>
<text class="sub" x="376" y="332">/api/recommend</text>
<rect x="728" y="112" width="192" height="88" rx="6" fill="#0e0e0f"/>
<rect x="728" y="112" width="192" height="88" rx="6" fill="#1d1d1f" stroke="#85837c" stroke-width="1"/>
